# Air-Gapped Local Decision Engine Deployment for OpenShift 4.20+
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jevops-decision-engine
  namespace: jevops-system
  labels:
    app.kubernetes.io/name: jevops-decision-engine
    app.kubernetes.io/part-of: jevops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jevops-decision-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jevops-decision-engine
    spec:
      serviceAccountName: jevops-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: decision-engine
          image: image-registry.openshift-image-registry.svc:5000/jevops-system/jevops-decision-engine:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: AIRGAPPED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jevops-decision-server
  namespace: jevops-system
spec:
  selector:
    app.kubernetes.io/name: jevops-decision-engine
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
