# Red Hat oc-mirror v2 ImageSetConfiguration
# Used to mirror JevOps container images into an air-gapped disconnected OpenShift 4.20+ registry
apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  platform:
    channels:
      - name: stable-4.20
        minVersion: 4.20.0
        maxVersion: 4.20.2
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
      packages:
        - name: opentelemetry-product
        - name: redhat-openshift-logging
        - name: cluster-observability-operator
  additionalImages:
    - name: ghcr.io/nubenetes/jevops-decision-engine:v0.1.0
    - name: ghcr.io/nubenetes/jevops-action-gate:v0.1.0
    - name: registry.access.redhat.com/ubi9/ubi-minimal:latest
