# Red Hat OpenShift 4.20+ Security Context Constraints (restricted-v2 compliance)
# Mandated for all enterprise workloads in disconnected and connected clusters.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: jevops-restricted-v2
  annotations:
    kubernetes.io/description: "Enforces non-root, capability drop, and strict isolation for JevOps."
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
fsGroup:
  type: MustRunAs
readOnlyRootFilesystem: true
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
