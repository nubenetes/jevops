apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jevops-suite.name" . }}
  labels:
    {{- include "jevops-suite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jevops-suite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jevops-suite.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: decision-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: JEVOPS_MODE
              value: "{{ .Values.config.mode }}"
            - name: TYPESAFE_API_KEY
              value: "{{ .Values.config.typesafeApiKey }}"
            - name: TYPESAFE_ENDPOINT
              value: "{{ .Values.config.typesafeEndpoint }}"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
